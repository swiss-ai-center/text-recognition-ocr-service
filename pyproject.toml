    "aiohappyeyeballs>=2.6.1",
    "aiohttp>=3.13.3",
    "aioitertools>=0.13.0",
    "aiosignal>=1.4.0",
    "anyio>=4.12.1",
    "attrs>=25.4.0",
    "botocore>=1.41.5",
    "cachetools>=7.0.5",
    "certifi>=2026.2.25",
    "chardet>=7.2.0",
    "click>=8.3.1",
    "colorama>=0.4.6",
    "common-code[test]",
    "coverage>=7.13.4",
    "distlib>=0.4.0",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "exceptiongroup>=1.3.1",
    "fastapi>=0.135.1",
    "filelock>=3.25.2",
    "flake8>=7.3.0",
    "frozenlist>=1.8.0",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.11",
    "iniconfig>=2.3.0",
    "jmespath>=1.1.0",
    "markupsafe>=3.0.3",
    "multidict>=6.7.1",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "packaging>=26.0",
    "pillow>=12.1.1",
    "pip>=26.0.1",
    "platformdirs>=4.9.4",
    "pluggy>=1.6.0",
    "pycodestyle>=2.14.0",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pyflakes>=3.4.0",
    "pytesseract>=0.3.13",
    "pytest>=8.1.1",
    "pytest-httpserver>=1.0.10",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "setuptools>=82.0.1",
    "six>=1.17.0",
    "sniffio>=1.3.1",
    "starlette>=0.52.1",
    "tomli>=2.4.0",
    "tox>=4.50.0",
    "typing-extensions>=4.15.0",
    "urllib3>=2.6.3",
    "uvicorn>=0.41.0",
    "virtualenv>=21.2.0",
    "werkzeug>=3.1.6",
    "wrapt>=1.17.3",
    "yarl>=1.23.0",
]
[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "--cov-config=.coveragerc --cov-report xml --cov-report term-missing --cov=./src"

